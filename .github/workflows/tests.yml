name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Run test suite
        run: python -m unittest -v

  guardrail-upstream:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read imported Guardrail revision
        id: guardrail
        shell: pwsh
        run: |
          $guardrailRevision = (Get-Content calculators/guardrail/upstream/source.json -Raw | ConvertFrom-Json).commit
          "commit=$guardrailRevision" >> $env:GITHUB_OUTPUT

      - name: Check out pinned Guardrail tests
        uses: actions/checkout@v7
        with:
          repository: colewinstead/Guardrail-Calculator
          ref: ${{ steps.guardrail.outputs.commit }}
          path: guardrail-upstream

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Run original Guardrail test suite
        working-directory: guardrail-upstream
        run: python -m unittest -v
