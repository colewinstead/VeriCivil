name: Legacy Tkinter Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt "pyinstaller>=6.0,<7.0"

      - name: Build Windows executable
        shell: pwsh
        run: ./scripts/build_windows.ps1 -SkipInstall

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: SuperElevation-Windows
          path: |
            dist/SuperElevation.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
