name: Legacy Tkinter macOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            artifact: SuperElevation-macOS-Apple-Silicon
          - runner: macos-15-intel
            artifact: SuperElevation-macOS-Intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt "pyinstaller>=6.0,<7.0"

      - name: Run test suite
        run: python -m unittest -v

      - name: Build macOS disk image
        run: ./scripts/build_macos.sh --skip-install --python python

      - name: Upload macOS release files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/SHA256SUMS-macOS-*.txt
          if-no-files-found: error
          retention-days: 30
