name: Full Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: full-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      release-required: ${{ steps.scope.outputs.release-required }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out complete release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify documentation-only changes
        id: scope
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          ARGS=(--base "$CHANGE_BASE" --head "$CHANGE_HEAD")
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            ARGS+=(--merge-base)
          fi
          REQUIRED=$(python scripts/classify_release_changes.py "${ARGS[@]}")
          echo "release-required=$REQUIRED" >> "$GITHUB_OUTPUT"
          if [[ "$REQUIRED" == "false" ]]; then
            echo "Documentation-only change: no version bump or release required."
          fi

      - name: Validate release version
        if: steps.scope.outputs.release-required == 'true'
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            python scripts/validate_release_version.py --allow-current-tag
          else
            python scripts/validate_release_version.py
          fi
          VERSION=$(python -c "from app_info import APP_VERSION; print(APP_VERSION)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build-browser:
    if: github.event_name == 'push' && needs.validate-version.outputs.release-required == 'true'
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Run shared-engine tests
        run: python -m unittest -v

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install browser dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Type-check browser app
        working-directory: web
        run: npm exec tsc -- --noEmit

      - name: Lint browser app
        working-directory: web
        run: npm run lint

      - name: Build and test browser app
        working-directory: web
        run: npm test

      - name: Package browser release
        shell: bash
        run: |
          ARCHIVE="Superelevation-Browser-${{ needs.validate-version.outputs.version }}.tar.gz"
          tar -czf "$ARCHIVE" -C web/dist .
          sha256sum "$ARCHIVE" > SHA256SUMS-browser.txt

      - name: Upload browser release files
        uses: actions/upload-artifact@v7
        with:
          name: browser-release-${{ needs.validate-version.outputs.version }}
          path: |
            Superelevation-Browser-${{ needs.validate-version.outputs.version }}.tar.gz
            SHA256SUMS-browser.txt
          if-no-files-found: error
          retention-days: 90

  publish-release:
    if: github.event_name == 'push' && needs.validate-version.outputs.release-required == 'true'
    needs: [validate-version, build-browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Superelevation Calculator v$RELEASE_VERSION" \
              --generate-notes \
              --latest
          fi
