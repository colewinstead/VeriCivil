name: Signed Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing latest stable release tag, for example v1.7.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signed-desktop-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate an existing released main commit
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          LATEST=$(gh release view --json tagName --jq .tagName)
          [[ "$REQUESTED_TAG" == "$LATEST" ]]
          SHA=$(git rev-list -n 1 "$REQUESTED_TAG")
          git merge-base --is-ancestor "$SHA" origin/main
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  sign:
    needs: validate
    environment: desktop-production
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win32
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python -m pip install -r requirements-lock.txt
      - run: npm --prefix web ci --ignore-scripts
      - run: node web/node_modules/electron/install.js
      - run: python -m unittest -v
      - run: npm --prefix web run desktop:test
      - run: npm --prefix web run desktop:build
      - run: npm --prefix web run desktop:test:offline
      - name: Build signed and notarized installers
        env:
          VERICIVIL_SIGNED_RELEASE: "true"
          CSC_LINK: ${{ matrix.platform == 'win32' && secrets.WINDOWS_CSC_LINK || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'win32' && secrets.WINDOWS_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
          VERICIVIL_WINDOWS_PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node web/desktop/installer.mjs
      - name: Verify Windows app and installer signatures
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $targets = Get-ChildItem desktop/installers/win32-x64/VeriCivil-Superelevation-*.exe
          $targets += Get-Item desktop/installers/win32-x64/win-unpacked/VeriCivilSuperelevation.exe
          foreach ($target in $targets) {
            if ((Get-AuthenticodeSignature -LiteralPath $target.FullName).Status -ne 'Valid') { throw 'Invalid production signature' }
          }
      - name: Verify Mac app signature and notarization
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find desktop/installers -name 'VeriCivil Superelevation.app' -print -quit)
          test -n "$APP"
          codesign --verify --deep --strict "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type exec "$APP"
      - uses: actions/upload-artifact@v7
        with:
          name: signed-desktop-${{ needs.validate.outputs.tag }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/installers/*/VeriCivil-Superelevation-*
            desktop/installers/*/latest-*.yml
          if-no-files-found: error

  publish:
    needs: [validate, sign]
    runs-on: ubuntu-latest
    environment: desktop-production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: signed-desktop-${{ needs.validate.outputs.tag }}-*
          path: signed-artifacts
          merge-multiple: true
      - name: Publish signed binaries before exposing update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' BINARIES < <(find signed-artifacts -type f ! -name '*.yml' -print0)
          mapfile -d '' FEEDS < <(find signed-artifacts -type f -name '*.yml' -print0)
          test "${#BINARIES[@]}" -gt 0
          test "${#FEEDS[@]}" -eq 3
          sha256sum "${BINARIES[@]}" > SHA256SUMS-signed-desktop.txt
          gh release upload "$RELEASE_TAG" "${BINARIES[@]}" SHA256SUMS-signed-desktop.txt
          gh release upload "$RELEASE_TAG" "${FEEDS[@]}"
